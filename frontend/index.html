<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="buxin store - Your gateway to the future of technology. Explore robotics, coding, and artificial intelligence.">
  <title>buxin store</title>
  <script>
    (() => {
      const theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.classList.add('theme-initialized');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="assets/theme.css?v=account-migration">
  <script src="config.js?v=account-migration"></script>
  <script src="app.js?v=account-migration" defer></script>
</head>
<body class="bg-[color:var(--app-bg)] text-[color:var(--app-text)] pb-20 transition-colors duration-300">
  <div id="tailwind-runtime-classes" class="hidden -mx-4 ? 0 1 2xl:grid-cols-10 absolute animate-pulse appearance-none aspect-square backdrop-blur-sm bg-[color:var(--app-card)] bg-[color:var(--app-card)]/90 bg-[color:var(--app-input)] bg-amber-100 bg-amber-500/15 bg-blue-100 bg-cyan-100 bg-gradient-to-br bg-gradient-to-r bg-green-100 bg-red-500 bg-transparent bg-white block border border-[color:var(--app-border)] border-b border-cyan-200 border-slate-200 border-slate-300 border-t cursor-pointer dark:bg-slate-900/50 dark:bg-slate-900/70 dark:border-slate-700 dark:border-slate-800 dark:text-slate-300 dark:text-slate-400 dark:text-white divide-[color:var(--app-border)] divide-y duration-200 duration-300 fa-google fab flex flex-1 flex-col flex-shrink-0 flex-wrap focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 font-bold font-extrabold font-medium font-semibold from-cyan-500 from-slate-100 gap-1 gap-2 gap-3 gap-4 gap-8 grid grid-cols-[58px_minmax(0,1fr)_auto] grid-cols-2 h-10 h-12 h-14 h-16 h-24 h-4 h-40 h-5 h-6 h-8 h-full hidden hover:bg-[color:var(--app-surface-hover)] hover:border-cyan-400 hover:border-cyan-500 hover:border-cyan-500/50 hover:gap-2 hover:scale-[1.02] hover:scale-105 hover:shadow-cyan-500/10 hover:shadow-cyan-500/30 hover:shadow-lg hover:shadow-xl hover:text-cyan-500 inline-block inline-flex inset-0 items-center items-start justify-between justify-center justify-end leading-7 left-2 lg:px-8 line-clamp-2 max-w-3xl max-w-4xl max-w-7xl max-w-sm mb-1 mb-2 mb-3 mb-4 mb-5 mb-6 mb-8 md:gap-4 md:grid-cols-[74px_minmax(0,1fr)_auto_auto] md:grid-cols-2 md:h-[74px] md:w-[74px] min-w-[140px] ml-2 ml-auto mt-1 mt-2 mt-3 mt-4 mt-5 mt-6 mt-8 mx-auto object-cover overflow-hidden overflow-x-auto p-3 p-4 p-5 p-6 p-8 pb-4 product-card pt-2 px-2 px-3 px-4 px-6 py-1 py-1.5 py-12 py-16 py-2 py-2.5 py-3 py-8 relative rounded rounded-2xl rounded-3xl rounded-full rounded-lg rounded-xl scrollbar-hide shadow-cyan-500/20 shadow-lg shadow-sm sm:flex-row sm:grid-cols-2 sm:max-w-md sm:mx-auto sm:px-6 sm:px-8 sm:w-full space-y-3 space-y-4 space-y-6 sr-only text-[color:var(--app-muted)] text-[color:var(--app-text)] text-2xl text-3xl text-amber-500 text-amber-700 text-blue-500 text-center text-cyan-400 text-cyan-500 text-green-500 text-green-600 text-lg text-red-500 text-slate-500 text-slate-700 text-slate-900 text-sm text-white text-xl text-xs to-blue-500 to-blue-600 to-slate-200 top-2 transition-all transition-colors transition-transform w-10 w-12 w-14 w-16 w-24 w-4 w-5 w-6 w-8 w-full whitespace-pre-line xl:grid-cols-7 z-10"></div>
  <div class="min-h-screen bg-[color:var(--app-bg)]">
    <div class="sticky top-0 z-50 bg-[color:var(--app-card)] backdrop-blur-xl border-b border-[color:var(--app-border)]">
      <div class="px-4 py-4">
        <div class="flex items-center justify-between mb-4">
          <a href="#/" class="flex items-center" aria-label="buxin store home">
            <img src="https://res.cloudinary.com/dfjffnmzf/image/upload/v1763781131/Gemini_Generated_Image_ufkia2ufkia2ufki_pcf2lq.png" alt="buxin store" class="h-12 w-auto">
          </a>
          <div class="flex items-center gap-2">
            <button type="button" id="theme-toggle" class="relative p-2 hover:bg-[color:var(--app-surface-hover)] rounded-xl transition-all" aria-label="Toggle dark mode">
              <i data-lucide="sun" class="w-5 h-5 hidden" data-theme-icon="light"></i>
              <i data-lucide="moon" class="w-5 h-5 hidden" data-theme-icon="dark"></i>
            </button>
            <a href="#/cart" class="p-2 hover:bg-[color:var(--app-surface-hover)] rounded-xl transition-colors relative" aria-label="Shopping cart">
              <i data-lucide="shopping-cart" class="w-6 h-6"></i>
              <span id="cart-count-badge" class="absolute -top-1 -right-1 bg-gradient-to-r from-cyan-500 to-blue-500 text-white text-xs w-5 h-5 rounded-full items-center justify-center font-bold hidden"><span id="cart-count">0</span></span>
            </a>
            <a href="#/login" id="account-link" class="flex items-center gap-2 p-1 pl-2 pr-3 hover:bg-[color:var(--app-surface-hover)] rounded-full transition-colors">
              <span class="hidden sm:flex flex-col text-right leading-tight"><span class="text-xs text-[color:var(--app-muted)]">Account</span><span class="text-sm font-semibold" id="account-label">Sign in</span></span>
              <img src="https://buxinstore.onrender.com/static/images/default-avatar.svg" alt="Profile" class="h-10 w-10 rounded-full border-2 border-white/70 object-cover shadow-sm">
            </a>
          </div>
        </div>
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-[color:var(--app-muted)]"></i>
          <form id="search-form" class="w-full"><input id="search-input" type="search" name="q" placeholder="Search products..." class="w-full bg-[color:var(--app-input)] border border-[color:var(--app-border)] rounded-xl py-3 pl-11 pr-4 text-sm text-[color:var(--app-text)] placeholder:text-[color:var(--app-muted)] focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all"></form>
        </div>
      </div>
    </div>
    <main id="app" class="px-4 py-6 bg-[color:var(--app-bg)]" aria-live="polite">
      <div class="py-16 text-center text-[color:var(--app-muted)]">Loading store…</div>
    </main>
    <footer class="bg-[color:var(--app-card)] backdrop-blur-xl border-t border-[color:var(--app-border)] mt-12 py-8 text-[color:var(--app-text)]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mt-4 border-t border-[color:var(--app-border)] pt-8 flex flex-col md:flex-row justify-between items-center">
          <p class="text-sm text-[color:var(--app-muted)]">&copy; <span id="copyright-year"></span> buxin store. All rights reserved.</p>
          <div class="mt-4 md:mt-0 flex space-x-6">
            <a href="#" class="text-[color:var(--app-muted)] hover:text-[color:var(--app-text)]" aria-label="Facebook"><i data-lucide="facebook" class="w-5 h-5"></i></a>
            <a href="#" class="text-[color:var(--app-muted)] hover:text-[color:var(--app-text)]" aria-label="Twitter"><i data-lucide="twitter" class="w-5 h-5"></i></a>
            <a href="#" class="text-[color:var(--app-muted)] hover:text-[color:var(--app-text)]" aria-label="Instagram"><i data-lucide="instagram" class="w-5 h-5"></i></a>
            <a href="#" class="text-[color:var(--app-muted)] hover:text-[color:var(--app-text)]" aria-label="YouTube"><i data-lucide="youtube" class="w-5 h-5"></i></a>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <div id="toast" class="fixed bottom-5 right-5 z-[80] hidden rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-xl" role="status" aria-live="polite"></div>
</body>
</html>
